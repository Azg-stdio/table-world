name: docs

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Mermaid blocks are parsed too (the checker skips them where mmdc is missing).
      - run: npm install --global @mermaid-js/mermaid-cli@11.4.2
      - run: python -I tools/docs/check_docs.py
